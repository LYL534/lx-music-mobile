name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'ios/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'src/**'
      - 'android/app/src/main/assets/script/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

jobs:
  iOS:
    name: iOS
    runs-on: macos-14
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (postinstall 应用 RNTP 补丁 + 生成 iOS preload)
        run: npm ci

      - name: Install pods
        working-directory: ios
        run: |
          bundle install
          bundle exec pod install --repo-update

      - name: Get package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 本仓库无 Apple 开发者证书, 产出未签名 IPA, 由用户侧 Sideloadly/AltStore 签名安装
      - name: Build archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LxMusicMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            archive

      - name: Package IPA
        run: |
          APP="ios/build/LxMusicMobile.xcarchive/Products/Applications/LxMusicMobile.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "lx-music-mobile-bili-v${{ steps.version.outputs.version }}-ios-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-bili-v${{ steps.version.outputs.version }}-ios-unsigned
          path: '*.ipa'
          retention-days: 30
